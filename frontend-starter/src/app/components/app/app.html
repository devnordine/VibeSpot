<header>
  <div>
    <b>VibeSpot</b>
    <small>Trouve le lieu qui colle à ton humeur</small>
  </div>
  <nav aria-label="Navigation principale">
    @if (authService.currentUser()) {
      <a routerLink="/explore" routerLinkActive="active" ariaCurrentWhenActive="page">Explorer</a>
      <a routerLink="/social" routerLinkActive="active" ariaCurrentWhenActive="page">Social</a>
      <a routerLink="/lists" routerLinkActive="active" ariaCurrentWhenActive="page">Listes</a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
      <button type="button" (click)="logout()">Déconnexion</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Connexion</a>
      <a routerLink="/register" routerLinkActive="active">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
