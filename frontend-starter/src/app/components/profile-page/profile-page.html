<section class="card">
  <h1>Mon profil</h1>

  @if (auth.currentUser(); as user) {
    <p>
      <b>{{ user.name }}</b><br />
      {{ user.email }}<br />
      <small>Membre depuis le {{ user.createdAt.slice(0, 10) }}</small>
    </p>

    <form [formGroup]="form" (ngSubmit)="save()">
      <label>
        Nouveau nom
        <input formControlName="name" placeholder="Votre nom" />
      </label>
      <button type="submit" [disabled]="form.invalid">Enregistrer</button>
    </form>
  } @else {
    <p>Chargement du profil en cours...</p>
  }
</section>
